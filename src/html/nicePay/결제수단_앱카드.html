<!doctype html>
<html lang="en">
@@include('../include/head.html')
<form>
    <div class="payment-window-background">
        <div class="payment-window">
            @@include('../include/header.html')
            <main>
                <div class="partner-logo-box">
                    <div class="partner-logo">
                        <img src="../../img/temp/bi.png" alt="이미지">
                    </div>
                </div>
                <section class="info-section">
                    <h3 class="title">결제 상품 정보</h3>
                    <ul class="item-list image">
                        <li class="item">
                            <div class="empty-bg">
                                <img src="" alt="">
                            </div>
                            <div>
                                <h5 class="item-title">[통합회원권] 강남 아쉬탕가끝[통합회원권] 강남 아쉬탕가끝[통합회원권] 강남 아쉬탕가끝[통합회원권] 강남
                                    아쉬탕가끝[통합회원권] 강남 아쉬탕가끝[통합회원권] 강남 아쉬탕가끝</h5>
                                <div class="item-content">
                                    <div class="quantity">
                                        <span>수량<i class="number">1</i>개</span>
                                    </div>
                                    <div class="amount">
                                        <span><i class="number">120,250</i></span>원
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </section>
                <section class="payment-method-section">
                    <h3 class="title">결제 수단 선택</h3>
                    <div class="payment-method-box _payment-method-box">
                        <button class="btn active" value="">앱카드</button>
                        <button class="btn" value="">네이버페이</button>
                        <button class="btn">카카오페이</button>
                        <input type="hidden"/>
                    </div>
                    <div class="tab-pane show">
                        <label class="input-label">
                            <select class="custom-select-box _app-bank-box" name="bank" required>
                                <option value="" disabled hidden selected>카드사를 선택해 주세요.</option>
                                <option value="1">신한은행</option>
                                <option value="2">하나은행</option>
                                <option value="3">국민은행</option>
                                <option value="4">우리은행</option>
                                <option value="5">농협은행</option>
                            </select>
                        </label>
                        <div class="_installment-box">
                            <label class="input-label _installment-box">
                                <select class="custom-select-box" name="bank" required>
                                    <option disabled hidden selected>할부 개월 수를 선택해 주세요.</option>
                                    <option value="">1개월</option>
                                    <option value="">2개월</option>
                                    <option value="">3개월</option>
                                    <option value="">4개월</option>
                                    <option value="">5개월</option>
                                    <option value="">6개월</option>
                                    <option value="">7개월</option>
                                    <option value="">8개월</option>
                                    <option value="">9개월</option>
                                    <option value="">10개월</option>
                                    <option value="">11개월</option>
                                    <option value="">12개월</option>

                                </select>
                            </label>
                        </div>
                        <p class="caption">무이자 할부 안내 〉</p>
                    </div>
                    @@include('../include/terms-list_email.html')
                </section>
                <p class="copyright">powered by Payple</p>
            </main>
            <footer>
                <button class="payment-btn" type="submit" disabled >
                    결제하기
                </button>
            </footer>
        </div>

    </div>
</form>
</html>
