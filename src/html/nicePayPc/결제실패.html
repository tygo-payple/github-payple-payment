<!doctype html>
<html lang="en">
@@include('../include/head.html')
<div class="payment-wrap">
    <header class="payment-header">
        <div class="title-box">
            <button>
                <i class="icon ico-back">뒤로가기</i>
            </button>
            <h1 class="title">결제하기</h1>
            <button class="_open-modal" data-modal-id="paymentCloseAlert">
                <i class="icon ico-close">종료하기</i>
            </button>
        </div>
    </header>
    <main style="background-color: #fff">
        <div class="logo-box">
            <div class="img" style="width: auto; height: 3rem">
                <img src="../../img/temp/bi.png" alt="로고">
            </div>
        </div>
        <div class="payment-complete-box">
            <div class="img-payment cancellation">
                <img src="../../img/image/img-payment-complete3.png" alt="결제 취소">
            </div>
            <h6 class="red">결제에 실패하였습니다.</h6>
            <p class="desc">이전 페이지로 돌아가 다시 시도해 주세요.</p>
            <button class="payment-btn" style="background-color: #E9ECF5; color: #383838">
                확인
            </button>
        </div>
    </main>

</div>

</html>
